<html lang="en">
<head>

<title>Everyday Nourish</title>

<meta name="apple-mobile-web-app-title" content="Nourish">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#5b6b3a">

<style>
:root{
  --bg:#f7f3ea; --card:#ffffff; --ink:#2b2a26; --muted:#6f6a5f; --line:#e6dfcf;
  --olive:#5b6b3a; --olive-2:#7d8f52; --terra:#c0623b; --sand:#efe6d2; --chip:#f2ecdf;
  --shadow:0 2px 10px rgba(60,50,30,.08);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#1c1d18;--card:#26271f;--ink:#efeadf;--muted:#b3ad9e;--line:#3a3b31;--olive:#a9bd78;--olive-2:#8fa35f;--terra:#e08a63;--sand:#2f3026;--chip:#303127;--shadow:none}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--olive)}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
header.top .back{background:none;border:0;color:var(--olive);font-size:16px;padding:6px 4px;cursor:pointer}
header.top h1{font-size:19px;margin:0;font-family:Georgia,"Times New Roman",serif;letter-spacing:.2px;flex:1}
header.top .logo{width:30px;height:30px;border-radius:9px;background:var(--olive);display:grid;place-items:center;color:#fff;font-size:17px}
main{max-width:680px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
.hero{background:linear-gradient(135deg,var(--olive),var(--olive-2));color:#fff;border-radius:18px;padding:18px;margin-bottom:16px}
.hero h2{margin:0 0 4px;font-family:Georgia,serif;font-size:24px}
.hero p{margin:0;opacity:.92;font-size:14px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 6px;font-weight:600}
.seg{display:flex;background:var(--sand);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:9px;font-size:15px;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--card);box-shadow:var(--shadow);font-weight:600;color:var(--olive)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;cursor:pointer;box-shadow:var(--shadow);color:var(--ink);font-size:16px}
.tile .ic{font-size:26px;display:block;margin-bottom:6px}
.tile b{display:block;font-size:17px}
.tile small{color:var(--muted)}
.wide{grid-column:1/-1;display:flex;align-items:center;gap:12px}
.wide .ic{margin:0}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:11px;padding:10px 14px;font-size:15px;cursor:pointer;background:var(--olive);color:#fff;font-weight:600}
.btn.ghost{background:var(--sand);color:var(--ink);font-weight:500}
.btn.terra{background:var(--terra)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card .ttl{display:inline;font-size:18px;font-weight:700;color:var(--olive);text-decoration:none;background:linear-gradient(transparent 62%,rgba(192,98,59,.22) 62%);font-family:Georgia,serif}
.card .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card p{margin:6px 0 10px;color:var(--muted);font-size:14.5px}
.heart{background:none;border:0;font-size:22px;cursor:pointer;line-height:1;padding:2px}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;background:var(--chip);color:var(--muted);margin-right:4px;margin-top:4px}
.badge.on{background:var(--terra);color:#fff}
.nut{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.nut div{background:var(--chip);border-radius:9px;padding:6px 2px}
.nut b{display:block;font-size:15px}
.nut span{font-size:10.5px;color:var(--muted)}
.who{font-size:12px;color:var(--muted);margin:8px 0 4px}
.na{font-size:13px;color:var(--muted);font-style:italic;background:var(--chip);border-radius:9px;padding:8px}
h2.pg{font-family:Georgia,serif;margin:4px 0 4px;font-size:26px;line-height:1.2}
.sub{color:var(--muted);margin:0 0 12px;font-size:14px}
.times{display:flex;gap:8px;margin:10px 0}
.times div{flex:1;background:var(--chip);border-radius:11px;padding:8px;text-align:center}
.times b{display:block;font-size:17px}
.times span{font-size:12px;color:var(--muted)}
ul.ing{list-style:none;padding:0;margin:0}
ul.ing li{padding:9px 0;border-bottom:1px solid var(--line)}
ul.ing li:last-child{border:0}
ul.ing .q{font-weight:700;color:var(--olive)}
ul.ing .swap{display:block;font-size:13px;color:var(--terra)}
ol.steps{padding-left:22px;margin:0}
ol.steps li{margin-bottom:10px}
.section h3{font-family:Georgia,serif;margin:18px 0 8px;font-size:20px}
.note{font-size:13px;color:var(--muted);background:var(--sand);border-radius:11px;padding:10px;margin:10px 0}
.day{margin-bottom:14px}
.day h3{font-family:Georgia,serif;margin:0 0 6px}
.meal-line{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.meal-line:last-of-type{border:0}
.meal-line .k{color:var(--muted);font-size:12px;width:62px;flex-shrink:0}
.meal-line a{flex:1;text-decoration:none;font-weight:600}
.meal-line .c{color:var(--muted);white-space:nowrap}
.tot{font-size:13px;color:var(--muted);margin-top:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 13px;font-size:14px;white-space:nowrap;color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--olive);color:#fff;border-color:var(--olive)}
.saveto{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.saveto button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-size:13.5px;cursor:pointer;color:var(--ink)}
.saveto button.on{background:var(--terra);color:#fff;border-color:var(--terra)}
input[type=text],input[type=password]{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.sw{width:50px;height:30px;border-radius:30px;background:var(--line);position:relative;border:0;cursor:pointer;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--olive)}
.sw.on::after{left:23px}
.loading{text-align:center;color:var(--muted);padding:30px 0}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--olive);border-radius:50%;animation:s 0.8s linear infinite;margin:0 auto 10px}
@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:24px}
details.ex{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
details.ex summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.ex summary::-webkit-details-marker{display:none}
details.ex summary span:first-child{min-width:0;color:var(--ink)}
details.ex summary .edit{color:var(--olive);font-weight:600;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:7px 12px;font-size:14px;color:var(--ink);cursor:pointer}
.chip.on{background:var(--terra);border-color:var(--terra);color:#fff}
.chip.on::before{content:"✕ "}
ul.ing s{color:var(--muted)}
.swapnote{font-size:12.5px;color:var(--terra);margin:-4px 0 8px}
.ai{border:1.5px dashed var(--olive);border-radius:16px;padding:14px;margin:4px 0 14px;background:var(--card)}
.ai .btn{width:100%;justify-content:center}
.src{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.src:last-child{border:0}
.src span:last-child{color:var(--muted);text-align:right}
</style>
</head>

const LIBMAP = Object.fromEntries(LIB.map(m=>[m.id,m]));

/* ---------- Constants ---------- */
const CATS = {b:{name:'Breakfast',ic:'☀️'},l:{name:'Lunch',ic:'🥗'},d:{name:'Dinner',ic:'🍽️'},s:{name:'Snacks',ic:'🍎'}};
const WHO = {f:{name:'Female',port:[['Her',1]]},m:{name:'Male',port:[['His',1.3]]},c:{name:'Couple',port:[['Her',1],['His',1.3]]}};
const SCALE = {f:1,m:1.3,c:2.3};
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const NUTL = [['Calories',''],['Fat','g'],['Cholesterol','mg'],['Sugar','g'],['Protein','g']];

/* ---------- Safe storage (only favorites, settings & a small history are kept) ---------- */
const store = {
  get(k,d){try{const v=localStorage.getItem('en_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('en_'+k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem('en_'+k)}catch(e){}}
};
const S = Object.assign({who:'f',mode:'daily',online:true,key:'',nkey:'',ex:[],exText:''},store.get('settings',{}));
function saveS(){store.set('settings',S)}
let FAVS = store.get('favs',[]);          // [{id,cat,meal?}]
let HIST = store.get('hist',{b:[],l:[],d:[],s:[]}); // recently shown ids per category

/* ---------- Lightweight in-memory cache (auto-trimmed) ---------- */
const CACHE = new Map(); const LISTS = new Map();
const CACHE_MAX = 40;
function cachePut(m){CACHE.delete(m.id);CACHE.set(m.id,m);while(CACHE.size>CACHE_MAX){CACHE.delete(CACHE.keys().next().value)}}
function clearCache(){CACHE.clear();LISTS.clear()}
function getMeal(id){return LIBMAP[id]||CACHE.get(id)||(FAVS.find(f=>f.id===id)||{}).meal||null}

/* ---------- Helpers ---------- */
const $ = s=>document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),1800)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pushHist(cat,ids){const h=HIST[cat]||[];ids.forEach(id=>{const i=h.indexOf(id);if(i>-1)h.splice(i,1);h.push(id)});HIST[cat]=h.slice(-15);store.set('hist',HIST)}
function isFav(id){return FAVS.some(f=>f.id===id)}

function fmtQty(q,unit){
  if(!q) return '';
  if(['clove','slice','stalk','leaves'].includes(unit)) q=Math.max(1,Math.round(q));
  if(unit==='oz') q=Math.round(q*2)/2;
  if(unit===''&&q>=1.5) q=Math.round(q); else if(unit===''&&q>=1) q=Math.round(q*2)/2;
  let w=Math.floor(q), f=q-w;
  const opts=[[0,''],[0.25,'¼'],[1/3,'⅓'],[0.5,'½'],[2/3,'⅔'],[0.75,'¾'],[1,'']];
  let best=opts[0];for(const o of opts){if(Math.abs(o[0]-f)<Math.abs(best[0]-f))best=o}
  if(best[0]===1){w+=1;best=[0,'']}
  if(w===0&&!best[1]) best=[0.25,'¼'];
  const txt=(w?w:'')+best[1];
  const val=w+best[0];
  let u=unit;
  if(u&&val>1&&['cup','slice','clove','stalk'].includes(u)) u+='s';
  return txt+(u?' '+u:'');
}
function nutFor(m,mult){return m.nu?m.nu.map(v=>v==null?null:Math.round(v*mult)):null}
function nutHTML(m){
  if(!m.nu) return '<div class="na">Nutrition not provided by this online source. Add a free Spoonacular key in Settings to get nutrition for online recipes.</div>';
  return WHO[S.who].port.map(([lab,mult])=>{
    const n=nutFor(m,mult);
    return `${S.who==='c'?`<div class="who">${lab} serving</div>`:''}<div class="nut">${NUTL.map((l,i)=>`<div><b>${n[i]==null?'—':n[i]+l[1]}</b><span>${l[0]}</span></div>`).join('')}</div>`;
  }).join('')+(m.nu.some(v=>v==null)?'<div class="sub" style="font-size:12.5px;margin-top:6px">This source only provides calories.</div>':'');
}

/* ---------- Favorites-aware random selection ---------- */
function prefProfile(){
  const p={};
  FAVS.forEach(f=>{const m=getMeal(f.id);if(!m)return;[m.cu,...(m.t||[])].forEach(k=>{if(k)p[k]=(p[k]||0)+1})});
  return p;
}
function weightOf(m,prof){
  let w=1;[m.cu,...(m.t||[])].forEach(k=>{if(prof[k])w+=0.5*Math.min(prof[k],3)});
  if(isFav(m.id)) w+=1.5;
  return Math.min(w,6);
}
function pickLocal(cat,n,exclude=[]){
  const prof=prefProfile(); const recent=HIST[cat]||[];
  let pool=LIB.filter(m=>m.c===cat&&!exclude.includes(m.id)&&mealOk(m));
  let fresh=pool.filter(m=>!recent.includes(m.id));
  if(fresh.length<n) fresh=pool.filter(m=>!recent.slice(-Math.max(0,pool.length-n)).includes(m.id));
  if(fresh.length<n) fresh=pool;
  const out=[]; let bag=fresh.slice();
  while(out.length<n&&bag.length){
    const tot=bag.reduce((s,m)=>s+weightOf(m,prof),0); let r=Math.random()*tot;
    let idx=0; for(;idx<bag.length;idx++){r-=weightOf(bag[idx],prof);if(r<=0)break}
    idx=Math.min(idx,bag.length-1); out.push(bag[idx]); bag.splice(idx,1);
  }
  return out;
}

 ['spicy','Spicy heat',['chili','chile','jalapeño','jalapeno','sriracha','gochujang','cayenne','curry paste','red pepper flakes','harissa','hot sauce','aleppo pepper']]
];
// phrases that look like an excluded word but aren't (e.g. "almond milk" is not dairy)
const EX_FP={
 dairy:/\b(almond|soy|oat|coconut|rice|cashew|plant|hemp)[- ]?(milk|yogurt|yoghurt|cream)s?\b|\b(peanut|almond|nut|cashew|sunflower|cocoa|seed)[- ]butters?\b|\bbutternut\b|\bbutter lettuce\b|\bcream of tartar\b|\bdairy-free\b/gi,
 gluten:/\b(chickpea|buckwheat|almond|rice|coconut|oat) flour\b|\bcorn tortillas?\b|\brice (noodles?|vermicelli)\b|\bzucchini noodles?\b|\b(chickpea|lentil|rice) pasta\b|\bchickpea or lentil pasta\b|\bgluten-free\b|\b100% buckwheat soba\b|\bbesan\b/gi,
 olives:/\bolive oil( spray)?\b/gi
};
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function exCustom(){return String(S.exText||'').split(/[,;\n]+/).map(s=>s.trim().toLowerCase()).filter(s=>s.length>1).slice(0,20)}
function exLabels(){return (S.ex||[]).map(k=>(EXC.find(e=>e[0]===k)||[])[1]).filter(Boolean).concat(exCustom())}
function exKeywords(){return (S.ex||[]).flatMap(k=>{const d=EXC.find(e=>e[0]===k);return d?d[2]:[]}).concat(exCustom())}
let _exKey=null,_exRules=[];
function exRules(){
  const key=JSON.stringify([S.ex,S.exText]); if(key===_exKey) return _exRules;
  const r=[];
  (S.ex||[]).forEach(k=>{const d=EXC.find(e=>e[0]===k);if(d)r.push({re:new RegExp('\\b(?:'+d[2].map(escRe).join('|')+')(?:s|es)?\\b','i'),fp:EX_FP[k]})});
  exCustom().forEach(w=>r.push({re:new RegExp('\\b'+escRe(w)+'(?:s|es)?\\b','i')}));
  _exKey=key;_exRules=r;return r;
}
function exHit(text){const t0=String(text||'').toLowerCase();return exRules().some(r=>r.re.test(r.fp?t0.replace(r.fp,' '):t0))}
// ok = meal fits the exclusions; swaps = ingredient rows replaced by their substitute
function mealCheck(m){
  if(!exRules().length) return {ok:true,swaps:[]};
  if(exHit(m.n)) return {ok:false,swaps:[]};
  const swaps=[];
  if(m.i){for(let x=0;x<m.i.length;x++){const item=m.i[x][2],sub=m.i[x][3];if(exHit(item)){if(sub&&!exHit(sub))swaps.push(x);else return {ok:false,swaps:[]}}}}
  else if(m.ingRaw&&m.ingRaw.some(r=>exHit(r.raw))) return {ok:false,swaps:[]};
  return {ok:true,swaps};
}
function mealOk(m){return mealCheck(m).ok}

const IN_VIEWER = typeof window.claude !== 'undefined'; // true on the claude.ai link (outside sites are blocked there)
function fetchJSON(url,ms=8000,headers){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),ms);
  return fetch(url,{signal:ctl.signal,headers:headers||{}}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).finally(()=>clearTimeout(t));
}
const UNHEALTHY=/fried|\bfry|cake|\bpies?\b|\btart\b|pudding|brownie|cookie|bacon|doughnut|donut|chips|batter|crumble|sausage|full english|creamy|cheesy|syrup|fudge|toffee|deep|pizza|burger|fries|nugget|lasagn|carbonara|alfredo|poutine|chocolate|caramel|biscuit|cinnamon roll|waffle|cocktail|lemonade|ice cream|dessert|candy/i;
const CAL_MAX={b:550,l:650,d:750,s:250};
function hashStr(s){let h=0;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))|0;return Math.abs(h).toString(36)}
function stepsFrom(x){
  const clean=s=>String(s&&s.step||s||'').replace(/^\s*(step\s*\d+[:.)]?|\d+[.)])\s*/i,'').trim();
  if(Array.isArray(x)) return x.map(clean).filter(s=>s.length>3);
  let parts=String(x||'').split(/\r?\n+/);
  if(parts.length<2) parts=String(x||'').split(/\.\s+(?=[A-Z])/).map((s,i,a)=>i<a.length-1?s+'.':s);
  const out=parts.map(clean).filter(s=>s.length>3);
  return out.length?out:['See the original recipe for directions.'];
}

// 1) TheMealDB — free, world cuisines, weighted toward Mediterranean regions
const MDB='https://www.themealdb.com/api/json/v1/1/';
const MED=['a=Greek','a=Italian','a=Spanish','a=Moroccan','a=Turkish','a=Tunisian','a=Croatian','a=Portuguese','a=French','a=Egyptian'];
const WORLD=['a=Japanese','a=Indian','a=Thai','a=Vietnamese','a=Mexican','a=Malaysian'];
const MDB_SRC={b:['c=Breakfast'],l:MED.concat(['c=Seafood','c=Vegetarian','c=Vegan'],WORLD.slice(0,4)),d:MED.concat(['c=Seafood','c=Chicken','c=Vegetarian'],WORLD),s:['c=Starter','c=Side']};
function mdbToMeal(x,cat){
  const ing=[];
  for(let i=1;i<=20;i++){const n=(x['strIngredient'+i]||'').trim();if(n)ing.push({raw:((x['strMeasure'+i]||'').trim()+' '+n).trim()})}
  const tags=(x.strTags||'').split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
  const area=x.strArea&&x.strArea!=='Unknown'?x.strArea:'';
  return {id:'mdb-'+x.idMeal,c:cat,n:x.strMeal,cu:area||x.strCategory,t:tags.concat([String(x.strCategory||'').toLowerCase()]).filter(Boolean).slice(0,4),
    d:`A ${area?area+' ':''}${String(x.strCategory||'dish').toLowerCase()} recipe from TheMealDB community collection.`,
    p:null,k:null,nu:null,online:'TheMealDB',src:x.strSource||('https://www.themealdb.com/meal/'+x.idMeal),img:x.strMealThumb,
    ingRaw:ing,s:stepsFrom(x.strInstructions),servingsNote:'Recipe as published (often serves 2–4). Adjust quantities to taste.'};
}
async function mdbFetch(cat,n){
  const recent=HIST[cat]||[]; const out=[];
  for(const q of shuffle(MDB_SRC[cat].slice()).slice(0,4)){
    if(out.length>=n) break;
    let list=LISTS.get(q);
    if(!list){const j=await fetchJSON(MDB+'filter.php?'+q);list=(j.meals||[]).filter(m=>!UNHEALTHY.test(m.strMeal)&&!exHit(m.strMeal));LISTS.set(q,list)}
    const cand=shuffle(list.filter(m=>!recent.includes('mdb-'+m.idMeal)&&!out.some(o=>o.id==='mdb-'+m.idMeal))).slice(0,n-out.length+1);
    const det=await Promise.all(cand.map(c=>fetchJSON(MDB+'lookup.php?i='+c.idMeal).then(j=>j.meals&&j.meals[0]).catch(()=>null)));
    det.filter(x=>x&&x.strCategory!=='Dessert'&&!UNHEALTHY.test(x.strMeal)).forEach(x=>{const m=mdbToMeal(x,cat);if(out.length<n&&mealOk(m))out.push(m)});
  }
  return out;
}

async function djFetch(cat,n){

// 3) Spoonacular — free key (about 50 points/day), full nutrition, supports exclusions
const SP_TYPE={b:['breakfast'],l:['salad','soup','main course'],d:['main course'],s:['snack','appetizer']};
const SP_CUI=['mediterranean','greek','italian','middle eastern','spanish','french','mediterranean','japanese','indian','mexican','korean','vietnamese','thai',''];
const SP_INTOL={dairy:'dairy',eggs:'egg',gluten:'gluten',nuts:'tree nut',peanuts:'peanut',shellfish:'shellfish',fish:'seafood',soy:'soy',sesame:'sesame'};
async function spFetch(cat,n){
  const type=shuffle(SP_TYPE[cat].slice())[0]; const cui=cat==='s'?'':shuffle(SP_CUI.slice())[0];
  const intol=(S.ex||[]).map(k=>SP_INTOL[k]).filter(Boolean);
  const exk=exKeywords().filter(w=>!/\s/.test(w)).slice(0,20);
  const u='https://api.spoonacular.com/recipes/complexSearch?apiKey='+encodeURIComponent(S.key)+'&type='+encodeURIComponent(type)+(cui?'&cuisine='+encodeURIComponent(cui):'')+
    (intol.length?'&intolerances='+encodeURIComponent(intol.join(',')):'')+(exk.length?'&excludeIngredients='+encodeURIComponent(exk.join(',')):'')+
    '&number='+(n+3)+'&sort=random&maxCalories='+CAL_MAX[cat]+'&maxSugar=25&maxSaturatedFat=10&addRecipeInformation=true&addRecipeNutrition=true&fillIngredients=true&instructionsRequired=true';
  const j=await fetchJSON(u,10000); const recent=HIST[cat]||[];
  return (j.results||[]).filter(r=>!recent.includes('sp-'+r.id)).map(r=>{
    const get=nm=>{const x=(r.nutrition&&r.nutrition.nutrients||[]).find(z=>z.name===nm);return x?Math.round(x.amount):0};
    const sv=r.servings||1;
    const ings=(r.extendedIngredients&&r.extendedIngredients.length?r.extendedIngredients:(r.missedIngredients||[]).concat(r.usedIngredients||[]));
    const steps=((r.analyzedInstructions&&r.analyzedInstructions[0]&&r.analyzedInstructions[0].steps)||[]).map(s=>s.step);
    const summary=String(r.summary||'').replace(/<[^>]+>/g,'').split('. ').slice(0,1).join('')+'.';
    return {id:'sp-'+r.id,c:cat,n:r.title,cu:(r.cuisines&&r.cuisines[0])||'Global',t:(r.diets||[]).slice(0,3),
      d:summary.length>180?summary.slice(0,177)+'…':summary,p:r.preparationMinutes>0?r.preparationMinutes:null,k:r.cookingMinutes>0?r.cookingMinutes:null,ready:r.readyInMinutes,
      nu:[get('Calories'),get('Fat'),get('Cholesterol'),get('Sugar'),get('Protein')],online:'Spoonacular',src:r.sourceUrl||r.spoonacularSourceUrl,img:r.image,
      i:ings.map(g=>[(g.amount||0)/sv,g.unitShort||g.unit||'',g.originalName||g.name,'']),s:steps.length?steps:['See the original recipe for directions.']};
  }).filter(mealOk).slice(0,n);
}

// 4) API Ninjas — free key, recipes with nutrition (free tier: 5 results per search)
const NJ_Q={b:['oatmeal','frittata','shakshuka','omelette','chia pudding','yogurt parfait','egg muffins','avocado toast','quinoa porridge','breakfast burrito'],
 l:['greek salad','lentil soup','chickpea salad','quinoa salad','tabbouleh','minestrone','gazpacho','tuna salad','white bean soup','fattoush','nicoise salad','buddha bowl','miso soup','black bean soup'],
 d:['baked salmon','grilled chicken','baked cod','shrimp stir fry','souvlaki','ratatouille','stuffed peppers','chickpea curry','fish tacos','tagine','grilled fish','turkey meatballs','lentil stew','chicken kebab'],
 s:['hummus','roasted chickpeas','baba ganoush','tzatziki','edamame','trail mix','energy bites','guacamole','stuffed grape leaves','muhammara']};
function njToMeal(r,cat){
  if(!r||!r.title) return null;
  const sv=parseInt(r.servings,10)||1; const nt=r.nutrition||{};
  const g=k=>{const v=Number(nt[k]);return isFinite(v)?v:null};
  let nu=[g('calories'),g('total_fat'),g('cholesterol'),g('sugars'),g('protein')];
  if(nu[0]!=null&&sv>1&&nu[0]>CAL_MAX[cat]*1.3) nu=nu.map(v=>v==null?null:v/sv); // totals -> per serving
  nu=nu.map(v=>v==null?null:Math.round(v));
  const ing=Array.isArray(r.ingredients)?r.ingredients:String(r.ingredients||'').split('|');
  const structured=ing.length>0&&typeof ing[0]==='object';
  const title=String(r.title).replace(/\b\w/g,c=>c.toUpperCase());
  return {id:'nj-'+hashStr(r.title),c:cat,n:title,cu:'Global',t:[],d:`A ${title.toLowerCase()} recipe from the API Ninjas recipe database.`,
    p:null,k:null,nu:nu.every(v=>v==null)?null:nu,online:'API Ninjas',
    i:structured?ing.map(x=>[(Number(x.quantity)||0)/sv,String(x.unit||''),String(x.name||''),'']):undefined,
    ingRaw:structured?undefined:ing.map(x=>({raw:String(x).trim()})).filter(x=>x.raw),s:stepsFrom(r.instructions)};
}
async function njFetch(cat,n){
  const qs=shuffle(NJ_Q[cat].filter(q=>!exHit(q))); if(!qs.length) return [];
  const j=await fetchJSON('https://api.api-ninjas.com/v3/recipe?title='+encodeURIComponent(qs[0])+'&limit=5',8000,{'X-Api-Key':S.nkey});
  const arr=Array.isArray(j)?j:(j.recipes||j.results||[]); const recent=HIST[cat]||[];
  return arr.map(r=>njToMeal(r,cat)).filter(m=>m&&!recent.includes(m.id)&&!UNHEALTHY.test(m.n)&&mealOk(m)).slice(0,n);
}

// Ask every enabled source at once, then interleave results (nutrition-rich sources first)
async function fetchOnline(cat,n){
  if(!S.online||!n||IN_VIEWER) return [];
  const srcs=[mdbFetch,djFetch]; if(S.key) srcs.push(spFetch); if(S.nkey) srcs.push(njFetch);
  const per=Math.ceil(n/srcs.length)+1;
  const res=await Promise.all(shuffle(srcs).map(fn=>fn(cat,per).catch(()=>[])));
  const rich=l=>l[0]&&l[0].nu&&l[0].nu[1]!=null?1:0;
  res.sort((a,b)=>rich(b)-rich(a));
  const out=[];
  for(let r=0;out.length<n&&r<per;r++) for(const list of res){const m=list[r];if(m&&out.length<n&&!out.some(o=>o.id===m.id||o.n.toLowerCase()===m.n.toLowerCase()))out.push(m)}
  out.forEach(cachePut); return out;
}

function toAiMeal(o,i,cat){
  if(!o||typeof o!=='object'||!o.name||!Array.isArray(o.ingredients)||!Array.isArray(o.steps)) return null;
  const nt=o.nutrition||{}; const num=v=>{const x=Number(v);return isFinite(x)&&v!==null&&v!==''?Math.round(x):null};
  const m={id:'ai-'+Date.now().toString(36)+i,c:cat,n:String(o.name).slice(0,90),cu:String(o.cuisine||'Global').slice(0,30),
    t:(Array.isArray(o.tags)?o.tags:[]).slice(0,4).map(t=>String(t).slice(0,20)),d:String(o.description||'').slice(0,220),
    p:num(o.prepMinutes),k:num(o.cookMinutes),nu:[num(nt.calories),num(nt.fat_g),num(nt.cholesterol_mg),num(nt.sugar_g),num(nt.protein_g)],
    i:o.ingredients.slice(0,15).map(x=>[Number(x&&x.qty)||0,String(x&&x.unit||''),String(x&&x.item||''),String(x&&x.substitute||'')]).filter(x=>x[2]),
    s:o.steps.slice(0,10).map(String).filter(Boolean),online:'Claude'};
  if(m.nu.every(v=>v==null)) m.nu=null;
  return m.i.length&&m.s.length?m:null;
}
const AI_MSG={rate_limited:'You’ve reached your Claude usage limit for now. Try again later.',session_expired:'Please sign in to Claude again, then try once more.',invalid_json:'The recipes came back in an unexpected format. Tap Try again.',refused:'Claude couldn’t create recipes for that request. Try changing your exclusions.',empty_completion:'No recipes came back. Tap Try again.'};
function aiBoxHTML(cat){
  if(!IN_VIEWER) return '';
  return `<div class="ai" id="aiBox" ${SAMPLE?'':'hidden'}><b>✨ Want something brand new?</b>
    <p class="sub" style="margin:4px 0 10px">Claude writes 5 fresh recipes for you, following your exclusions and favorites. It uses your own Claude account and takes about 20–60 seconds.</p>
    <div id="aiCtl"><button class="btn" onclick="askClaude('${cat}')">Create 5 new ideas</button></div><div id="aiOut"></div></div>`;
}
async function askClaude(cat){
  if(!SAMPLE||!$('#aiCtl')) return;
  const ctl=new AbortController(); aiCtl=ctl;
  $('#aiCtl').innerHTML='<div class="loading" style="padding:8px 0 12px"><div class="spin"></div><span id="aiStat">Thinking up new recipes… this can take up to a minute.</span></div><button class="btn ghost" onclick="aiCtl&&aiCtl.abort()">Stop</button>';
  try{
    const data=await SAMPLE.json(aiPrompt(cat),{cache:false,signal:ctl.signal,onText:()=>{const st=$('#aiStat');if(st)st.textContent='Writing your recipes…'}});
    if(aiCtl!==ctl||!$('#aiOut')) return;
    const arr=Array.isArray(data)?data:(data&&(data.recipes||data.meals))||[];
    const meals=arr.map((o,i)=>toAiMeal(o,i,cat)).filter(m=>m&&mealOk(m));
    meals.forEach(cachePut); pushHist(cat,meals.map(m=>m.id));
    $('#aiOut').innerHTML=meals.length?`<div class="label">New from Claude</div>${meals.map(m=>cardHTML(m)).join('')}`:'<div class="note">None of the new ideas fit your exclusions. Tap the button to try again.</div>';
    $('#aiCtl').innerHTML=`<button class="btn" onclick="askClaude('${cat}')">Create 5 more ideas</button>`;
  }catch(e){
    if(!$('#aiCtl')) return;
    const c=e&&e.code;
    if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)){SAMPLE=null;$('#aiBox').innerHTML='<div class="note">Claude recipe ideas aren’t available here. The library meals above still work.</div>';return}
    $('#aiCtl').innerHTML=`<button class="btn" onclick="askClaude('${cat}')">${c==='cancelled'?'Create 5 new ideas':'Try again'}</button>`;
    if(c!=='cancelled') $('#aiOut').insertAdjacentHTML('afterbegin',`<div class="note">${esc(AI_MSG[c]||'Couldn’t get new ideas right now. Tap Try again.')}</div>`);
  }
}

function planRows(day,mult){
  const keys=[['b','Breakfast'],['l','Lunch'],['d','Dinner'],['s','Snack'],['s2','Snack']];
  const tot=[0,0,0,0,0];
  const rows=keys.map(([k,lab])=>{const m=day[k];
    if(!m) return `<div class="meal-line"><span class="k">${lab}</span><span style="flex:1;color:var(--muted)">No meal fits your exclusions</span></div>`;
    m.nu.forEach((v,i)=>tot[i]+=v);
    return `<div class="meal-line"><span class="k">${lab}</span><a href="#/meal/${m.id}">${esc(m.n)}</a><span class="c">${Math.round(m.nu[0]*mult)} cal</span></div>`}).join('');
  return {rows,tot};
}
function totLine(tot){
  return WHO[S.who].port.map(([lab,mult])=>`<div class="tot"><b>${S.who==='c'?lab+': ':'Day total: '}</b>${Math.round(tot[0]*mult)} cal · ${Math.round(tot[1]*mult)}g fat · ${Math.round(tot[2]*mult)}mg chol · ${Math.round(tot[3]*mult)}g sugar · ${Math.round(tot[4]*mult)}g protein</div>`).join('');
}
function buildDays(n){
  const pk={b:fillPicks('b',n),l:fillPicks('l',n),d:fillPicks('d',n)}; const snacks=fillPicks('s',n*2);
  const days=[];for(let i=0;i<n;i++)days.push({b:pk.b[i],l:pk.l[i],d:pk.d[i],s:snacks[i*2],s2:snacks[i*2+1]});
  ['b','l','d'].forEach(k=>pushHist(k,pk[k].map(m=>m.id)));pushHist('s',snacks.map(m=>m.id));
  return days;
}
function vDay(){

function removeFav(id){FAVS=FAVS.filter(f=>f.id!==id);store.set('favs',FAVS);toast('Removed');render()}
function quickFav(id,btn){
  if(isFav(id)){FAVS=FAVS.filter(f=>f.id!==id);store.set('favs',FAVS);btn.textContent='🤍';toast('Removed from Favorites');return}
  const m=getMeal(id); if(!m) return;
  const rec={id,cat:m.c}; if(!LIBMAP[id]) rec.meal=m;
  FAVS.unshift(rec); FAVS=FAVS.slice(0,200); store.set('favs',FAVS); btn.textContent='❤️'; toast('Saved to '+CATS[m.c].name);
}

/* ---------- Router ---------- */
async function render(){
  if(aiCtl){aiCtl.abort();aiCtl=null}
  const h=location.hash||'#/'; const parts=h.slice(2).split('/');
  let html;
  try{
    if(parts[0]==='cat') html=await vCat(parts[1]);
    else if(parts[0]==='meal') html=vMeal(decodeURIComponent(parts[1]||''));
    else if(parts[0]==='fav') html=vFav();
    else if(parts[0]==='day') html=vDay();
    else if(parts[0]==='week') html=vWeek();
    else if(parts[0]==='settings') html=vSettings();
    else html=vHome();
  }catch(e){html='<div class="card"><p>Something went wrong. Please go back and try again.</p></div>'}
  if(html==null) return;
  $('#app').innerHTML=html; window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);
window.addEventListener('pagehide',clearCache); // free memory when leaving

/* ---------- Home-screen icon ---------- */
(function icon(){
  try{
    const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
    const g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,'#5b6b3a');g.addColorStop(1,'#8fa35f');
    x.fillStyle=g;x.fillRect(0,0,180,180);
    x.fillStyle='#f7f3ea';x.beginPath();x.ellipse(90,84,34,58,Math.PI/4,0,Math.PI*2);x.fill();
    x.strokeStyle='#5b6b3a';x.lineWidth=5;x.beginPath();x.moveTo(52,128);x.lineTo(124,48);x.stroke();
    x.fillStyle='#c0623b';x.beginPath();x.arc(132,134,14,0,Math.PI*2);x.fill();
    const url=c.toDataURL('image/png');
        const f=document.createElement('link');f.rel='icon';f.href=url;document.head.appendChild(f);
  }catch(e){}
})();

render();
</script>
